name: Keep API alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render API
        run: |
          if ! curl --fail --silent --show-error --max-time 30 \
            https://collection-pokemon-tcg.onrender.com/health/live; then
            curl --fail --silent --show-error --max-time 30 \
              https://collection-pokemon-tcg.onrender.com/health
          fi
