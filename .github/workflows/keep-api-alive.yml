name: Keep API alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render API and database
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
            https://collection-pokemon-tcg.onrender.com/health
