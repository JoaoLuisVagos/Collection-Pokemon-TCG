name: Keep API alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render API
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 15 \
            --max-time 120 \
            https://collection-pokemon-tcg.onrender.com/health
